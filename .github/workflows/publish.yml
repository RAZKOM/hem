# Publish hem-core, hem-tui and hem to crates.io when a version tag is pushed.
#
# Authentication uses crates.io Trusted Publishing: GitHub issues an OIDC
# token for this workflow, crates-io-auth-action exchanges it for a
# short-lived crates.io token (revoked when the job ends). No secret is
# stored in the repository. Each crate must list this repository, this
# workflow file (publish.yml) and the `crates-io` environment under
# Settings -> Trusted Publishing on crates.io.
#
# Kept separate from release.yml so `dist generate` never overwrites it.

name: Publish to crates.io

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  publish:
    name: Publish crates
    needs: test
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hem") | .version')
          echo "tag: $tag · Cargo.toml: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the hem version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in hem-core hem-tui hem; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "User-Agent: hem-release (github.com/RAZKOM/hem)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = "200" ]; then
              echo "$crate $VERSION is already on crates.io, skipping"
              continue
            fi
            echo "Publishing $crate $VERSION"
            # cargo waits until the new version is visible in the index,
            # so the next crate can depend on it immediately.
            cargo publish -p "$crate" --locked
          done
