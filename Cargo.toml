[workspace]
members = []
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RAZKOM/hem"
authors = ["RAZKOM <269026521+RAZKOM@users.noreply.github.com>"]
rust-version = "1.89"

[workspace.dependencies]
hem-core = { path = "crates/hem-core", version = "0.1.0" }
hem-tui = { path = "crates/hem-tui", version = "0.1.0" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
memchr = "2"
regex = "1"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
parking_lot = "0.12"
tempfile = "3"

[package]
name = "hem"
description = "hem: Human-readable Event Monitor. tail, but tailored."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["log", "tui", "tail", "viewer", "terminal"]
categories = ["command-line-utilities", "development-tools::debugging"]
default-run = "hem"

[[bin]]
name = "hem"
path = "src/main.rs"

[dependencies]

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
debug = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
